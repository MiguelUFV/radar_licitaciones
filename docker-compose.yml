# Entorno local del proyecto. Los puertos solo escuchan en 127.0.0.1.
services:
  postgres:
    image: postgres:17
    container_name: radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_DB_N8N: ${POSTGRES_DB_N8N:-n8n}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.8
    container_name: radar_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB_N8N:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-radar}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?falta N8N_ENCRYPTION_KEY en .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Madrid}
      TZ: ${GENERIC_TIMEZONE:-Europe/Madrid}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      # El puerto 5678 se deja libre para la instalación propia de Miguel (n8n start).
      # Este n8n, el del proyecto, se publica en el 5679.
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      WEBHOOK_URL: http://localhost:5679/
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:5679:5678"
    volumes:
      - datos_n8n:/home/node/.n8n

  agente:
    build: .
    container_name: radar_agente
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      TZ: ${GENERIC_TIMEZONE:-Europe/Madrid}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Los ficheros descargados se quedan en el proyecto, no dentro del contenedor.
      - ./data:/app/data

volumes:
  datos_postgres:
  datos_n8n:
