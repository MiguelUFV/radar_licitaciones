[project]
name = "radar-licitaciones"
version = "0.1.0"
description = "Radar de licitaciones: lee el pliego y dice a qué concursos puede presentarse una empresa"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "certifi>=2026.1.1",
    "pypdf>=6.19",
    "python-dotenv>=1.1",
    "psycopg[binary]>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]
